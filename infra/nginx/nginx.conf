# Production reverse-proxy example for System Web Studio.
# Mounted over /etc/nginx/nginx.conf; site definitions live in conf.d/*.conf.
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  server_tokens off;
  sendfile on;
  keepalive_timeout 65;

  # Request id: keep a well-formed id supplied by an upstream hop (e.g. a load balancer),
  # otherwise generate one. Malformed values are replaced so they cannot inject into logs/headers.
  map $http_x_request_id $studio_request_id {
    default                          $request_id;
    "~^[A-Za-z0-9._-]{8,64}$"        $http_x_request_id;
  }

  # WebSocket readiness (Next.js dev/HMR or future streaming endpoints).
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  log_format studio '$remote_addr - [$time_iso8601] "$request" $status $body_bytes_sent '
                    'rt=$request_time rid=$studio_request_id host=$host';
  access_log /var/log/nginx/access.log studio;

  include /etc/nginx/conf.d/*.conf;
}
