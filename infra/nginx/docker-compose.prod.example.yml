# EXAMPLE production topology (single host). Copy, adjust, and supply real secrets through an env file that is
# NOT committed:  docker compose -f docker-compose.prod.example.yml --env-file prod.env up -d
# Only nginx publishes ports. PostgreSQL, Redis, MinIO, RabbitMQ and the backend live on an internal network.
#
# Required variables (no defaults for secrets on purpose; compose fails if they are missing):
#   TLS_CERT_DIR            host directory with studio/{fullchain,privkey}.pem and storage/{...}.pem
#   POSTGRES_PASSWORD, REDIS_PASSWORD, MINIO_ROOT_USER, MINIO_ROOT_PASSWORD, RABBITMQ_PASSWORD
#   BACKEND_IMAGE, FRONTEND_IMAGE   images you build from backend/ and the Next.js app
#   MINIO_PUBLIC_ENDPOINT   https://storage.example.com
#   CORS_ALLOWED_ORIGINS    https://studio.example.com
#   TRUSTED_PROXY_CIDRS     the CIDR of the "internal" network (nginx reaches the backend from it; see README)
services:
  nginx:
    image: nginx:stable
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./conf.d:/etc/nginx/conf.d:ro
      - ${TLS_CERT_DIR:?set TLS_CERT_DIR}:/etc/nginx/certs:ro
      - certbot-webroot:/var/www/certbot:ro
    networks: [edge, internal]
    depends_on: [frontend, backend, minio]

  frontend:
    image: ${FRONTEND_IMAGE:?set FRONTEND_IMAGE}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_PROXY_TARGET: http://backend:8080
    networks: [internal]

  backend:
    image: ${BACKEND_IMAGE:?set BACKEND_IMAGE}
    restart: unless-stopped
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/system_web_studio
      DATABASE_USER: studio
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?}
      REDIS_HOST: redis
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:?}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?}
      TRUST_PROXY: "true"
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:?}
    networks: [internal]
    depends_on: [postgres, redis, minio, rabbitmq]

  postgres:
    image: postgres:17.6
    restart: unless-stopped
    environment:
      POSTGRES_DB: system_web_studio
      POSTGRES_USER: studio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes: [pgdata:/var/lib/postgresql/data]
    networks: [internal]

  redis:
    image: redis:8.2.1-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction", "--requirepass", "${REDIS_PASSWORD:?}"]
    volumes: [redisdata:/data]
    networks: [internal]

  minio:
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?}
    volumes: [miniodata:/bitnami/minio/data]
    networks: [internal]

  rabbitmq:
    image: rabbitmq:4-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: studio
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?}
    volumes: [rabbitdata:/var/lib/rabbitmq]
    networks: [internal]

  # Optional: Let's Encrypt via certbot (webroot). Issue once, then renew from cron (see README).
  #   docker compose -f docker-compose.prod.example.yml run --rm certbot certonly --webroot -w /var/www/certbot \
  #     -d studio.example.com --email ops@example.com --agree-tos
  # certbot writes to /etc/letsencrypt/live/<name>/; point TLS_CERT_DIR at a directory whose studio/ and storage/
  # sub-directories are symlinks/copies of those (or edit ssl_certificate paths to live/<name>/).
  certbot:
    image: certbot/certbot
    profiles: ["certbot"]
    volumes:
      - ${TLS_CERT_DIR}:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    networks: [edge]

networks:
  edge: {}                       # reachable from outside through nginx's published ports
  internal:
    internal: true               # no route to the internet or the host: backend/DB/Redis/MinIO/RabbitMQ are isolated

volumes:
  pgdata:
  redisdata:
  miniodata:
  rabbitdata:
  certbot-webroot:
