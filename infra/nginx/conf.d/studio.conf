# Replace studio.example.com / storage.example.com with your hostnames before use.
# TLS material is NOT part of this repository: mount your certificate directory at /etc/nginx/certs
# (see docker-compose.prod.example.yml, variable TLS_CERT_DIR). Expected layout:
#   /etc/nginx/certs/studio/fullchain.pem  /etc/nginx/certs/studio/privkey.pem
#   /etc/nginx/certs/storage/fullchain.pem /etc/nginx/certs/storage/privkey.pem  (or reuse one SAN/wildcard cert)

upstream studio_frontend { server frontend:3000; keepalive 16; }
upstream studio_backend  { server backend:8080;  keepalive 16; }

# ---------------------------------------------------------------- HTTP: ACME + redirect
server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name studio.example.com storage.example.com;

  # certbot --webroot challenge directory (mounted read-only here, writable in the certbot container)
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

# ---------------------------------------------------------------- HTTPS: application
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name studio.example.com;

  ssl_certificate     /etc/nginx/certs/studio/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/studio/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_timeout 1d;
  ssl_session_cache   shared:SSL:10m;
  ssl_session_tickets off;

  # Security headers. Content-Security-Policy is intentionally NOT set here: the Next.js app emits a
  # per-request nonce CSP itself (proxy.ts); a static nginx CSP would break the nonce or duplicate it.
  # "always" so the headers are also present on 4xx/5xx responses generated by nginx.
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options    "nosniff" always;
  add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
  # NOTE: nginx drops parent add_header directives in any location that defines its own add_header.
  # None of the locations below do; keep it that way or repeat the block.

  # Request body: the API caps asset uploads; keep nginx at least as large as the API limit.
  client_max_body_size 12m;
  client_body_timeout 30s;
  client_header_timeout 15s;
  send_timeout 60s;

  # Shared proxy settings. X-Forwarded-For is OVERWRITTEN with the TCP peer address, never appended:
  # ($proxy_add_x_forwarded_for would keep a client-supplied value and let anyone spoof their IP.)
  # If another trusted proxy/LB sits in front of this nginx, use the realip module instead (see README).
  proxy_http_version 1.1;
  proxy_set_header Host               $host;
  proxy_set_header X-Real-IP          $remote_addr;
  proxy_set_header X-Forwarded-For    $remote_addr;
  proxy_set_header X-Forwarded-Proto  $scheme;
  proxy_set_header X-Forwarded-Host   $host;
  proxy_set_header X-Request-Id       $studio_request_id;
  proxy_set_header Upgrade            $http_upgrade;
  proxy_set_header Connection         $connection_upgrade;
  proxy_connect_timeout 5s;
  proxy_send_timeout    60s;
  proxy_read_timeout    60s;
  add_header X-Request-Id $studio_request_id always;

  # Backend: JSON API and OIDC endpoints. No trailing slash on proxy_pass => the URI is passed unchanged.
  location /api/ {
    proxy_pass http://studio_backend;
  }
  location /oauth2/ {
    proxy_pass http://studio_backend;
  }
  location /login/oauth2/ {
    proxy_pass http://studio_backend;
  }

  # Everything else: the Next.js server.
  location / {
    proxy_pass http://studio_frontend;
  }
}

# ---------------------------------------------------------------- HTTPS: object storage (presigned URLs)
# The API signs URLs against MINIO_PUBLIC_ENDPOINT, so the Host header the browser sends MUST reach
# MinIO unchanged (S3 SigV4 signs the host). Set MINIO_PUBLIC_ENDPOINT=https://storage.example.com.
# Alternative without this block: publish MinIO/S3 on its own TLS endpoint and point
# MINIO_PUBLIC_ENDPOINT there (e.g. a managed S3 bucket URL).
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name storage.example.com;

  ssl_certificate     /etc/nginx/certs/storage/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/storage/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_session_tickets off;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options    "nosniff" always;

  # Assets are uploaded straight to MinIO through presigned PUTs; large bodies must stream.
  client_max_body_size 64m;
  proxy_request_buffering off;
  proxy_buffering off;
  proxy_connect_timeout 5s;
  proxy_send_timeout    300s;
  proxy_read_timeout    300s;

  location / {
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;   # signed host, unchanged (includes the port when non-default)
    proxy_set_header Connection "";
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://minio:9000;
  }
}
