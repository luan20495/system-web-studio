# PostgreSQL 17 settings for continuous WAL archiving (point-in-time recovery).
# Used with:  postgres -c config_file=/etc/postgresql/pitr.conf   (PGDATA stays /var/lib/postgresql/data,
# so pg_hba.conf / pg_ident.conf are still read from the data directory).
listen_addresses = '*'
max_connections = 100
shared_buffers = 128MB

wal_level = replica
archive_mode = on
# Safe archive command: never overwrite an existing segment (returns non-zero if it exists, so a
# misconfigured second cluster cannot silently clobber another cluster's WAL), copy to a temp name, then rename
# so a half-copied segment is never visible to restore_command or pg_archivecleanup.
archive_command = 'test ! -f /wal-archive/%f && cp %p /wal-archive/.%f.tmp && mv /wal-archive/.%f.tmp /wal-archive/%f'
# Force a segment switch at least every N seconds so the loss window (RPO) on a quiet database is bounded.
# Lower = smaller RPO but more 16MB files (segments are padded). 60s is a reasonable starting point.
archive_timeout = 60
# Never delete WAL that has not been archived yet.
max_wal_size = 1GB
min_wal_size = 80MB
