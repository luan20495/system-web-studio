# Production profile. Anything without a default here makes startup FAIL when the environment variable is missing:
# there is deliberately no silent fallback to localhost, empty or "local-only" credentials.
spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}
server:
  address: ${SERVER_ADDRESS}
  servlet:
    session:
      cookie:
        secure: true            # not configurable in prod
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS:health}
logging:
  structured:
    format:
      console: logstash          # JSON, includes MDC (requestId, traceId, spanId when tracing is on)
  pattern:
    level: "%5p"
app:
  proxy:
    trust: ${TRUST_PROXY}        # must be stated explicitly: true behind nginx/caddy, false only if the API is exposed directly
    trusted-cidrs: ${TRUSTED_PROXY_CIDRS:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  storage:
    endpoint: ${MINIO_ENDPOINT}
    public-endpoint: ${MINIO_PUBLIC_ENDPOINT}
    access-key: ${MINIO_ROOT_USER}
    secret-key: ${MINIO_ROOT_PASSWORD}
  deploy:
    step-delay-ms: 0
  sites:
    origin: ${SITES_ORIGIN}
    studio-origin: ${STUDIO_ORIGIN}
    data-api-base: ${SITES_DATA_API_BASE:}   # optional; when set: https, not loopback / private (ProductionConfigValidator)
  render:
    url: ${RENDER_URL}
  workflow:
    queue: ${WORKFLOW_QUEUE:amqp}      # H-5: RabbitMQ is the only production queue; WORKFLOW_QUEUE=memory (or anything but amqp) stops the start
