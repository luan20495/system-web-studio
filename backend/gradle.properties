kotlin.code.style=official
org.gradle.caching=true
org.gradle.parallel=true
# Heap for the Gradle JVM and the Kotlin compiler daemon: the default is too small for the test sources (GC overhead limit exceeded in compileTestKotlin, B-C2-B3-04, seen again on the C5 import gate)
org.gradle.jvmargs=-Xmx2g -XX:+UseParallelGC
kotlin.daemon.jvmargs=-Xmx3g
